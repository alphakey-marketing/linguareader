kind = "web"
previewPath = "/"
title = "LinguaReader"
version = "1.0.0"
id = "artifacts/lingua-reader"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22508

[services.development]
run = "pnpm --filter @workspace/lingua-reader run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/lingua-reader", "run", "build" ]
publicDir = "artifacts/lingua-reader/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22508"
BASE_PATH = "/"
